name: LIFE quality checks

on:
  pull_request:
    branches: [main, feat/life-consent-consistency-20261031, feat/life-explore-20261101]
  push:
    branches: [feat/life-arrival-20261101]

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without production secrets
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Check JavaScript module syntax
        run: |
          node --check server.js
          node --check social.js
          node --check life-network.js
          node --check garden.js
          node --check garden-stories.js
          node --check garden-stories-mcp.js
          node --check life-explore.js
          node --check life-arrival.js
      - name: Test LIFE permissions and collaborative stories
        run: npm run test:access
      - name: Other local regression suites
        run: |
          npm run test:local
          npm run test:client
          npm run test:mcp
          npm run test:factory
          npm run test:comedy
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate OpenAPI YAML and reject duplicate keys
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          from yaml.constructor import ConstructorError
          class UniqueLoader(yaml.SafeLoader):
              pass
          def unique_mapping(loader, node):
              mapping = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=True)
                  if key in mapping:
                      raise ConstructorError(None, None, f"duplicate YAML key: {key!r}", key_node.start_mark)
                  mapping[key] = loader.construct_object(value_node, deep=True)
              return mapping
          UniqueLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, unique_mapping)
          document = yaml.load(Path('openapi.yaml').read_text(), Loader=UniqueLoader)
          assert document['openapi'] == '3.0.3'
          assert len(document['paths']) >= 59, len(document['paths'])
          assert '/v1/life/arrival' in document['paths']
          assert '/v1/life/explore' in document['paths']
          assert '/v1/life/gardens/{id}/scenes' in document['paths']
          assert '/v1/life/gardens/{id}/scenes/{sceneId}' in document['paths']
          assert set(['bearerAuth','adminAuth','registrationInvite']) <= set(document['components']['securitySchemes'])
          print('PASS:', len(document['paths']), 'unique API paths and one security definition')
          PY

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: social_test
          POSTGRES_USER: social_test
          POSTGRES_PASSWORD: isolated_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U social_test -d social_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgres://social_test:isolated_test_only@127.0.0.1:5432/social_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Verify upgrade from main schema using an additive, repeatable migration
        run: |
          git show origin/main:schema.sql > /tmp/soc-preupgrade-schema.sql
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import pg from 'pg';
          const pool = new pg.Pool({connectionString:process.env.TEST_DATABASE_URL,ssl:false});
          try {
            await pool.query(await readFile('/tmp/soc-preupgrade-schema.sql','utf8'));
            // Synthetic records model a nonempty production installation.
            // They must survive the additive migration byte-for-byte.
            const agent = 'a1000000-1111-4111-8111-111111111111';
            await pool.query(
              "INSERT INTO agents(id,handle,display_name,token_hash,is_test) VALUES($1,'legacy_agent','Legacy Agent',$2,true)",
              [agent,'a'.repeat(64)]);
            await pool.query(
              "INSERT INTO gardens(owner_id,name,description) VALUES($1,'Existing Garden','Persistent before upgrade')",
              [agent]);
            await pool.query(
              "INSERT INTO space_posts(space_id,agent_id,body) VALUES('life',$1,'Existing social message')",
              [agent]);
            const before = await pool.query(
              "SELECT (SELECT count(*)::int FROM agents) AS agents,(SELECT count(*)::int FROM gardens) AS gardens,(SELECT count(*)::int FROM space_posts) AS posts");
            const migration = await readFile('migrations/20261031_garden_scenes.sql','utf8');
            await pool.query(migration);
            await pool.query(migration);
            const after = await pool.query(
              "SELECT (SELECT count(*)::int FROM agents) AS agents,(SELECT count(*)::int FROM gardens) AS gardens,(SELECT count(*)::int FROM space_posts) AS posts");
            if(JSON.stringify(before.rows[0])!==JSON.stringify(after.rows[0]))throw new Error('Migration changed existing data');
            const r=await pool.query("SELECT count(*)::int AS tables FROM information_schema.tables WHERE table_name='garden_scenes'");
            if(r.rows[0].tables!==1)throw new Error('Garden scenes migration not present');
            const preserved=await pool.query(
              "SELECT g.name,p.body FROM gardens g CROSS JOIN space_posts p WHERE g.name='Existing Garden' AND p.body='Existing social message'");
            if(preserved.rowCount!==1)throw new Error('Legacy records lost after migration');
            // Clear only synthetic CI fixtures so the integration test remains independent.
            await pool.query("DELETE FROM space_posts WHERE agent_id=$1",[agent]);
            await pool.query("DELETE FROM gardens WHERE owner_id=$1",[agent]);
            await pool.query("DELETE FROM agents WHERE id=$1",[agent]);
            console.log('PASS: PostgreSQL 17 baseline with data, repeatable additive Garden migration, no data loss');
          } finally { await pool.end(); }
          JS
      - name: Verify real SQL and access rules using three synthetic agents
        run: node --test tests/postgres.integration.test.mjs
